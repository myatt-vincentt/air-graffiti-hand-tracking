    <script>
      // Resolve theme before first paint to avoid flash.
      // Priority: ?theme=light|dark URL param → system preference.
      (function () {
        try {
          var params = new URLSearchParams(window.location.search);
          var override = params.get("theme");
          var resolved =
            override === "light" || override === "dark"
              ? override
              : window.matchMedia("(prefers-color-scheme: dark)").matches
                ? "dark"
                : "light";
          document.documentElement.dataset.theme = resolved;
          document.documentElement.classList.toggle(
            "dark",
            resolved === "dark",
          );
        } catch (_) {}
      })();
    </script>

    <!-- Tracking files come from here. They are not preloaded: on a slow link a
